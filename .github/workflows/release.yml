name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.suffix }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x64
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: macos-x64
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            suffix: macos-arm64
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x64
            archive: zip
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp target/${{ matrix.target }}/release/hyper.exe dist/
            cp target/${{ matrix.target }}/release/hy.exe dist/
            (cd dist && zip -r ../hyper-${{ matrix.suffix }}.zip .)
          else
            cp target/${{ matrix.target }}/release/hyper dist/
            cp target/${{ matrix.target }}/release/hy dist/
            tar -czf hyper-${{ matrix.suffix }}.tar.gz -C dist .
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyper-${{ matrix.suffix }}
          path: hyper-${{ matrix.suffix }}.${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
