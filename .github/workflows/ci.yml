name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  macos-files:
    name: macOS native file boundary
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@v2
      - name: Native compiler target
        run: rustc -vV
      - name: POSIX traversal tests
        run: cargo test --lib posix_file
      - name: Opened file and path replacement tests
        run: cargo test --lib tool_file
      - name: Direct tools and JSONL integration
        run: cargo test --test macos_files
      - name: POSIX checkpoint and restore walker
        run: cargo test --lib posix_admin
      - name: Administrative checkpoint and restore integration
        run: cargo test --test macos_admin
      - name: Automatic context audit filtering
        run: cargo test --lib macos_automatic_context

  windows-hardlinks:
    name: Windows native hardlink boundary
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@v2
      - name: Handle and audit boundary tests
        run: cargo test --lib windows_
      - name: Direct tools and search integration
        run: cargo test --test windows_hardlinks

  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install ripgrep (runtime dependency)
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --all-targets

      - name: Node for offline evaluation graders
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Offline evaluation fixtures and CLI
        run: |
          cargo build --bin hyper
          python3 -m unittest discover -s evals -v

  build:
    name: release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install ripgrep (runtime dependency)
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: cargo build --release
        run: cargo build --release
